name: deadman

# Runs on someone else's electricity, which is the entire point: the machine being watched
# cannot report its own death. Every quarter of an hour this looks at how old the server's
# heartbeat is and says something only when the answer changes.
#
# Off the round minutes on purpose (2026-10-06). "*/15" asked for 96 runs a day and got
# 3-6: GitHub's scheduler is best-effort and drops most runs at :00/:15/:30/:45, where
# every schedule on the platform lands, and its own docs advise against the top of the
# hour. That stretched the 30-minute silence threshold to an 8-hour blind spot. Minutes
# 7/22/37/52 keep the same quarter-hour cadence away from the crowd.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# The job writes state.json back so it remembers whether it has already raised the alarm,
# and so the repository keeps showing activity - GitHub retires scheduled workflows in a
# repository untouched for 60 days.
permissions:
  contents: write

# Two overlapping runs would both read the same state and both send the same message.
concurrency:
  group: deadman
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check the heartbeat
        id: check
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          # Anonymous GitHub API calls are limited to 60 an hour per address, and hosted
          # runners share their addresses with everybody else's jobs - so the watchman
          # goes blind at random moments, which is the one thing it must not do. The same
          # gist-scope token the server already uses is enough; watcher.py reads it if it
          # is there and works without it if it is not.
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: python3 watcher.py

      - name: Remember what was seen
        if: steps.check.outputs.commit == 'true'
        run: |
          git config user.name "deadman"
          git config user.email "deadman@users.noreply.github.com"
          git add state.json
          # Nothing to commit is a normal outcome of a race with a manual run, not a failure.
          git diff --cached --quiet || git commit -m "state: $(python3 -c "import json;print(json.load(open('state.json'))['status'])")"
          git push
